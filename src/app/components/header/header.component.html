<!-- components/header/header.component.html -->
<header class="header">
  <div class="header-left">
    <button class="mobile-toggle" (click)="toggleMobileMenu()">
      <i class="fas" [class.fa-times]="showMobileMenu" [class.fa-bars]="!showMobileMenu"></i>
    </button>

    <div class="search-box">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        placeholder="Rechercher..."
        class="search-input"
        (input)="search($event)"
      />
    </div>
  </div>

  <div class="header-right">
    <div class="header-actions">
      <button class="action-btn notification-btn" title="Notifications">
        <i class="fas fa-bell"></i>
        <span class="notification-badge">3</span>
      </button>

      <div class="user-dropdown" [class.active]="showUserDropdown">
        <button class="user-btn" (click)="toggleUserDropdown()">
          <div class="user-avatar">AD</div>
          <div class="user-info">
            <span class="user-name">Admin User</span>
            <span class="user-role">Administrateur</span>
          </div>
          <i class="fas fa-user user-icon"></i>
        </button>

        <div class="dropdown-menu" *ngIf="showUserDropdown">
          <a href="#" class="dropdown-item">
            <i class="fas fa-user dropdown-icon"></i>
            Mon Profil
          </a>
          <a href="#" class="dropdown-item">
            <i class="fas fa-cog dropdown-icon"></i>
            Paramètres
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout-btn" (click)="logout()">
            <i class="fas fa-sign-out-alt dropdown-icon"></i>
            Déconnexion
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.active]="showMobileMenu">
    <div class="mobile-menu-header">
      <h3>Menu</h3>
      <button class="close-btn" (click)="toggleMobileMenu()">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <nav class="mobile-nav">
      <a href="/dashboard" class="mobile-nav-item">
        <i class="fas fa-chart-line"></i>
        Dashboard
      </a>
      <a href="/inventory" class="mobile-nav-item">
        <i class="fas fa-boxes"></i>
        Inventaire
      </a>
      <a href="/products" class="mobile-nav-item">
        <i class="fas fa-tags"></i>
        Produits
      </a>
      <a href="/warehouses" class="mobile-nav-item">
        <i class="fas fa-warehouse"></i>
        Entrepôts
      </a>
      <a href="/orders" class="mobile-nav-item">
        <i class="fas fa-clipboard-list"></i>
        Commandes
      </a>
      <a href="/reports" class="mobile-nav-item">
        <i class="fas fa-chart-bar"></i>
        Rapports
      </a>
      <a href="/settings" class="mobile-nav-item">
        <i class="fas fa-cog"></i>
        Paramètres
      </a>
    </nav>
  </div>
</header>
